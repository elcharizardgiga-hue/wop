name: Build SidePlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout SidePlay
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build SidePlay web UI
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply SidePlay native Android patches
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache --stacktrace --no-daemon

      - name: Prepare phone-downloadable APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/SidePlay-debug.apk
          sha256sum release/SidePlay-debug.apk > release/SHA256.txt
          printf 'SidePlay v0.3.1 debug APK\nBuilt by GitHub Actions\nPackage: app.sideplay.mobile\n' > release/README.txt

      - name: Upload SidePlay APK
        uses: actions/upload-artifact@v4
        with:
          name: SidePlay-v0.3.1-APK
          path: release/
          if-no-files-found: error
          retention-days: 14
